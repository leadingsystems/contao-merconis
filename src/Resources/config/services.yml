parameters:
  merconis.sitemap.product_urls_handled_externally: false

services:

  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  merconis.routing.scope:
    class: LeadingSystems\MerconisBundle\Services\Scope
    public: true

  merconis.routing.download_link_helper:
    class: LeadingSystems\MerconisBundle\Services\DownloadLinkHelper
    public: true

  LeadingSystems\MerconisBundle\Controller\Backend\DownloadExportController:
    tags: [ 'controller.service_arguments' ]
    arguments:
      $projectDir: '%kernel.project_dir%'

  merconis.helpers.general:
    class: LeadingSystems\MerconisBundle\Helpers\GeneralHelper
    arguments:
      - '@merconis.helpers.ip_checker'
    public: true

  merconis.helpers.ip_checker:
    class: LeadingSystems\MerconisBundle\Helpers\IpChecker
    public: true

  LeadingSystems\MerconisBundle\EventSubscriber\LsjsInsertionSubscriber:
    arguments:
      - '@contao.framework'
      - '@contao.routing.scope_matcher'
      - '@contao.security.token_checker'
      - '%contao.web_dir%'
      - '%kernel.project_dir%'
    tags:
      - { name: 'kernel.event_subscriber' }

  LeadingSystems\MerconisBundle\FastFilter\FastFilterConfigurationRepository: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterQueryService: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterOptionProvider: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterEstimateProvider: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterMatcher: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterFormService: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterIndexBuilder: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterIndexMaintenance: ~
  LeadingSystems\MerconisBundle\FastFilter\FastFilterIndexVerifier: ~

  LeadingSystems\MerconisBundle\FastFilter\FastFilterSessionWriter:
    public: true

  LeadingSystems\MerconisBundle\FastFilter\FastFilterController:
    public: true

  LeadingSystems\MerconisBundle\FastFilter\FastFilterSearchCoordinator:
    public: true

  LeadingSystems\MerconisBundle\FastFilter\FastFilterFormRenderer:
    public: true

  LeadingSystems\MerconisBundle\Command\FastFilterIndexRebuildCommand:
    tags:
      - { name: 'console.command', command: 'merconis:fast-filter:rebuild-index' }

  LeadingSystems\MerconisBundle\Command\FastFilterIndexVerifyCommand:
    tags:
      - { name: 'console.command', command: 'merconis:fast-filter:verify-index' }

  LeadingSystems\MerconisBundle\EventListener\GetPageLayoutListener:
    tags:
      - { name: contao.hook, hook: getPageLayout, method: switchTemplateInDetailsViewIfNecessary }
      - { name: contao.hook, hook: getPageLayout, method: getLayoutSettingsForGlobalUse }

  LeadingSystems\MerconisBundle\EventListener\GeneratePageListener:
    tags:
      - { name: contao.hook, hook: generatePage }

  LeadingSystems\MerconisBundle\EventListener\LoadLanguageFileListener:
    tags:
      - { name: contao.hook, hook: loadLanguageFile }

  LeadingSystems\MerconisBundle\EventListener\OutputBackendTemplateListener:
    tags:
      - { name: contao.hook, hook: outputBackendTemplate }

  LeadingSystems\MerconisBundle\EventListener\LoadFormFieldListener:
    tags:
      - { name: contao.hook, hook: loadFormField }

  LeadingSystems\MerconisBundle\EventListener\GetContentElementListener:
    tags:
      - { name: contao.hook, hook: getContentElement }

  LeadingSystems\MerconisBundle\EventListener\GetArticleListener:
    tags:
      - { name: contao.hook, hook: getArticle }

  LeadingSystems\MerconisBundle\EventListener\LoadDataContainerListener:
    tags:
      - { name: contao.hook, hook: loadDataContainer }

  LeadingSystems\MerconisBundle\EventListener\ModifyFrontendPageListener:
    tags:
      - { name: contao.hook, hook: modifyFrontendPage }

  LeadingSystems\MerconisBundle\EventListener\GetUserNavigationListener:
    tags:
      - { name: contao.hook, hook: getUserNavigation}

  LeadingSystems\MerconisBundle\EventListener\GetSystemMessagesListener:
    tags:
      - { name: contao.hook, hook: getSystemMessages }

  LeadingSystems\MerconisBundle\EventListener\OutputFrontendTemplateListener:
    tags:
      - { name: contao.hook, hook: outputFrontendTemplate }

  LeadingSystems\MerconisBundle\EventListener\ProcessFormDataListener:
    tags:
      - { name: contao.hook, hook: processFormData }

  LeadingSystems\MerconisBundle\EventListener\ExecutePreActionsListener:
    tags:
      - { name: contao.hook, hook: executePreActions }

  LeadingSystems\MerconisBundle\EventListener\ExecutePostActionsListener:
    tags:
      - { name: contao.hook, hook: executePostActions }

  LeadingSystems\MerconisBundle\EventListener\AddCustomRegexpListener:
    tags:
      - { name: contao.hook, hook: addCustomRegexp }

  LeadingSystems\MerconisBundle\EventListener\RequestListener:
    arguments:
      - '@contao.framework'
      - '@contao.routing.scope_matcher'
      - '@merconis.helpers.general'
    tags:
      - { name: kernel.event_listener, priority: 15 }

  LeadingSystems\MerconisBundle\Sitemap\SitemapPageScope: ~

  LeadingSystems\MerconisBundle\Sitemap\SitemapUrlAppender: ~

  merconis.eventlistener.loginlistener:
    class: LeadingSystems\MerconisBundle\EventListener\LoginListener
    tags:
      - { name: kernel.event_listener, event: security.interactive_login }

  merconis.eventlistener.sitemaplistener:
    class: LeadingSystems\MerconisBundle\EventListener\SitemapListener
    arguments:
      $productUrlsHandledExternally: '%merconis.sitemap.product_urls_handled_externally%'
    tags:
      - { name: kernel.event_listener, event: contao.sitemap }

  merconis.controller.backend.product_search:
    class: LeadingSystems\MerconisBundle\Controller\ProductSearchController
    public: true
    arguments:
      - "@contao.framework"

  merconis.controller.backend.pick_value:
    class: LeadingSystems\MerconisBundle\Controller\ValuePickerController
    public: true
    arguments:
      - "@contao.framework"

  merconis.controller.backend.show_mail:
    class: LeadingSystems\MerconisBundle\Controller\ShowMailController
    public: true
    arguments:
      - "@database_connection"
      - "@twig"

  merconis.listener.data_container.layout_options:
    class: Contao\CoreBundle\EventListener\DataContainer\LayoutOptionsListener
    arguments:
      - '@database_connection'
    tags:
      - { name: contao.callback, table: tl_page, target: fields.lsShopLayoutForDetailsView.options }


  LeadingSystems\MerconisBundle\Messenger\RestockInfo:
    public: true
    arguments:
      - '@database_connection'
      - '0 0 * * *'
    tags:
      - { name: ls_scheduler.schedulable}

  LeadingSystems\MerconisBundle\Messenger\OnStatusChangeDaily:
    public: true
    arguments:
      - '@database_connection'
      - '0 0 * * *'
    tags:
      - { name: ls_scheduler.schedulable }

  LeadingSystems\MerconisBundle\Messenger\OnStatusChangeHourly:
    public: true
    arguments:
      - '@database_connection'
      - '0 * * * *'
    tags:
      - { name: ls_scheduler.schedulable }


  LeadingSystems\MerconisBundle\InsertTag\AsInsertTag\:
    resource: '../../InsertTag/AsInsertTag'

  LeadingSystems\MerconisBundle\InsertTag\AsBlockInsertTag\:
    resource: '../../InsertTag/AsBlockInsertTag'

  merconis.session:
    class: LeadingSystems\MerconisBundle\Services\Session
    public: true

  merconis.migration.update_shop_product_page_config_migration:
    class: LeadingSystems\MerconisBundle\Migration\UpdateShopProductPageConfigMigration
    tags:
      - { name: contao.migration, priority: 0 }

  merconis.migration.filter_migration:
    class: LeadingSystems\MerconisBundle\Migration\FilterMigration
    tags:
      - { name: contao.migration, priority: 0 }

  merconis.migration.filter_mode_migration:
    class: LeadingSystems\MerconisBundle\Migration\FilterModeMigration
    arguments:
      - '@doctrine.dbal.default_connection'
    tags:
      - { name: contao.migration, priority: 0 }


  merconis.migration.dynamic_attachment_paths_migration:
    class: LeadingSystems\MerconisBundle\Migration\DynamicAttachmentPathsMigration
    tags:
      - { name: contao.migration, priority: 0 }

  merconis.migration.migrate_shop_serial_to_merconis_license_key_migration:
    class: LeadingSystems\MerconisBundle\Migration\MigrateShopSerialToMerconisLicenseKeyMigration
    tags:
      - { name: contao.migration, priority: 0 }


  LeadingSystems\MerconisBundle\EventListener\Post:
    tags:
      - { name: contao.hook, hook: initializeSystem }

  LeadingSystems\MerconisBundle\EventListener\SelectButtonsRemoveListener:
    tags:
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_steuersaetze' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_attribute_values' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_attributes' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_configurator' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_delivery_info' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_output_definitions' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_shipping_methods' }
      - { name: contao.callback, target: 'select.buttons', table: 'tl_ls_shop_payment_methods' }