services:

  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  merconis.routing.scope:
    class: LeadingSystems\MerconisBundle\Services\Scope
    public: true

  _instanceof:
    LeadingSystems\MerconisBundle\SearchServer\AdapterInterfaces\ClientInterface:
      tags: [ 'merconis.search_server_adapters_client' ]

    LeadingSystems\MerconisBundle\SearchServer\AdapterInterfaces\TestsInterface:
      tags: [ 'merconis.search_server_adapters_tests' ]

    LeadingSystems\MerconisBundle\SearchServer\AdapterInterfaces\IndexManageInterface:
      tags: [ 'merconis.search_server_adapters_index_manage' ]

    LeadingSystems\MerconisBundle\SearchServer\AdapterInterfaces\IndexSearchInterface:
      tags: [ 'merconis.search_server_adapters_index_search' ]

    LeadingSystems\MerconisBundle\SearchServer\AdapterInterfaces\IndexSyncInterface:
      tags: [ 'merconis.search_server_adapters_index_sync' ]

  LeadingSystems\MerconisBundle\SearchServer\SearchServer:
    # must be public because we have to use it in Merconis legacy code where we can't inject it properly
    public: true
    lazy: true
    arguments:
      - !tagged_iterator merconis.search_server_adapters_client
      - !tagged_iterator merconis.search_server_adapters_tests
      - !tagged_iterator merconis.search_server_adapters_index_manage
      - !tagged_iterator merconis.search_server_adapters_index_search
      - !tagged_iterator merconis.search_server_adapters_index_sync

  # Search server adapter services, auto tagged with _instanceof, therefore depending on implementing AdapterInterfaces\ClientInterface -->
  LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Client:

  # Search server adapter services, auto tagged with _instanceof, therefore depending on implementing AdapterInterfaces\TestsInterface -->
  LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Tests:
    arguments:
      $client: '@LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Client'

  # Search server adapter services, auto tagged with _instanceof, therefore depending on implementing AdapterInterfaces\IndexManageInterface -->
  LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Index\Product\Manage:
    arguments:
      $client: '@LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Client'

  # Search server adapter services, auto tagged with _instanceof, therefore depending on implementing AdapterInterfaces\IndexSearchInterface -->
  LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Index\Product\Search:
    arguments:
      $client: '@LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Client'

  # Search server adapter services, auto tagged with _instanceof, therefore depending on implementing AdapterInterfaces\IndexSyncInterface -->
  LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Index\Product\Sync:
    arguments:
      $client: '@LeadingSystems\MerconisBundle\SearchServer\Adapters\Elasticsearch\Client'



  LeadingSystems\MerconisBundle\ProductSearch\Adapter:
    # must be public because we have to use it in Merconis legacy code where we can't inject it properly
    public: true
    shared: false
    arguments:
      $searchServer: '@LeadingSystems\MerconisBundle\SearchServer\SearchServer'
      $twig: '@twig'
      $logger: '@logger'
      $requestStack: '@request_stack'

  LeadingSystems\MerconisBundle\ProductSearch\Helper:
    # must be public because we have to use it in Merconis legacy code where we can't inject it properly
    public: true


  LeadingSystems\MerconisBundle\EventSubscriber\LsjsInsertionSubscriber:
    arguments:
      - '@contao.framework'
      - '@contao.routing.scope_matcher'
      - '@contao.security.token_checker'
      - '%contao.web_dir%'
      - '%kernel.project_dir%'
    tags:
      - { name: 'kernel.event_subscriber' }

  LeadingSystems\MerconisBundle\EventListener\GetPageLayoutListener:
    tags:
      - { name: contao.hook, hook: getPageLayout, method: switchTemplateInDetailsViewIfNecessary }
      - { name: contao.hook, hook: getPageLayout, method: getLayoutSettingsForGlobalUse }

  merconis.eventlistener.loginlistener:
    class: LeadingSystems\MerconisBundle\EventListener\LoginListener
    tags:
      - { name: kernel.event_listener, event: security.interactive_login }

  merconis.eventlistener.sitemaplistener:
    class: LeadingSystems\MerconisBundle\EventListener\SitemapListener
    tags:
      - { name: kernel.event_listener, event: contao.sitemap }

  merconis.controller.backend.product_search:
    class: LeadingSystems\MerconisBundle\Controller\ProductSearchController
    public: true
    arguments:
      - "@contao.framework"

  merconis.controller.backend.pick_value:
    class: LeadingSystems\MerconisBundle\Controller\ValuePickerController
    public: true
    arguments:
      - "@contao.framework"

  merconis.controller.backend.show_mail:
    class: LeadingSystems\MerconisBundle\Controller\ShowMailController
    public: true
    arguments:
      - "@database_connection"
      - "@twig"

  merconis.listener.data_container.layout_options:
    class: Contao\CoreBundle\EventListener\DataContainer\LayoutOptionsListener
    arguments:
      - '@database_connection'
    tags:
      - { name: contao.callback, table: tl_page, target: fields.lsShopLayoutForDetailsView.options }

  merconis.cron.hourly:
    class: LeadingSystems\MerconisBundle\Cronjob\Hourly
    tags:
      - { name: contao.cronjob, interval: hourly }

  merconis.cron.daily:
    class: LeadingSystems\MerconisBundle\Cronjob\Daily
    tags:
      - { name: contao.cronjob, interval: daily }

  LeadingSystems\MerconisBundle\Common\Session\ObjectStatePersistor\ObjectStatePersistorController:
    public: true

  LeadingSystems\MerconisBundle\Common\Session\ObjectStatePersistor\EventSubscriber\ObjectStatePersistorEventSubscriber:
    arguments:
      - '@LeadingSystems\MerconisBundle\Common\Session\ObjectStatePersistor\ObjectStatePersistorController'
    tags:
      - { name: kernel.event_subscriber }