merconis.backend.product_search:
  path: /contao/merconis/products/search
  defaults:
    _controller: merconis.controller.backend.product_search
    _scope:      "backend"
    _token_check: true
    _custom_backend_view: true

merconis.backend.pick_value:
  path: /contao/merconis/value
  defaults:
    _controller: merconis.controller.backend.pick_value
    _scope:      "backend"
    _token_check: true
    _custom_backend_view: true

merconis.backend.show_mail_html_body:
  path: /contao/merconis/mail/{messageId}
  requirements:
    messageId: '\d+'
  defaults:
    _controller: merconis.controller.backend.show_mail
    _scope:      "backend"
    _token_check: true
    _custom_backend_view: true

merconis.backend.downloadExportAction:
  path: /contao/download/export-output/{fileName}
  controller: LeadingSystems\MerconisBundle\Controller\Backend\DownloadExportController::downloadAction
  methods: [GET]
  requirements:
    fileName: '^[\w\-\.]+$'